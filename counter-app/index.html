<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f6fb">
    <title>Counter App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="counter-card">
      <p class="eyebrow">A little practice project</p>
      <h1>Counter</h1>
      <output class="count" id="count" aria-live="polite" aria-atomic="true">0</output>

      <div class="controls" aria-label="Counter controls">
        <button class="control-button secondary" id="decrement" type="button" aria-label="Decrease count">−</button>
        <button class="control-button primary" id="increment" type="button" aria-label="Increase count">+</button>
      </div>
      <button class="reset-button" id="reset" type="button">Reset</button>
    </main>
  </body>
</html>
