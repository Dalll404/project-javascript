<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple, relaxing digital canvas for your sketches and ideas."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Canvas — A little space to create</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <a class="brand" href="#" aria-label="Canvas home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path d="M7 23.8 22.8 8a3.1 3.1 0 0 1 4.4 4.4L11.4 28.2 5 30l2-6.2Z" />
              <path d="m19.7 11.1 4.4 4.4M8 22.8l4.4 4.4" />
            </svg>
          </span>
          <span>canvas<span class="brand-period">.</span></span>
        </a>
        <span class="header-note"><span class="status-dot"></span> Your space to create</span>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">A FRESH PAGE</p>
        <h1 id="page-title">Make a little <span>something.</span></h1>
        <p class="intro-copy">A blank canvas, a few colors, and wherever your mind takes you.</p>
      </section>

      <section class="studio" aria-label="Drawing studio">
        <div class="toolbar" role="toolbar" aria-label="Drawing tools">
          <div class="tool-group" aria-label="Tools">
            <button class="tool-button active" id="brush" type="button" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m14.7 6.3 3 3M5 19l3.7-.8L19 6.9a2.1 2.1 0 0 0-3-3L5.7 14.2 5 19Z" />
                <path d="M4 21h16" />
              </svg>
              <span>Brush</span>
            </button>
            <button class="tool-button" id="eraser" type="button" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m7.2 16.8-3-3a2.1 2.1 0 0 1 0-3l6.6-6.6a2.1 2.1 0 0 1 3 0l6 6a2.1 2.1 0 0 1 0 3L14 19H9.4l-2.2-2.2Z" />
                <path d="m8 7 9 9M14 19l3 3" />
              </svg>
              <span>Eraser</span>
            </button>
          </div>

          <span class="toolbar-divider" aria-hidden="true"></span>

          <div class="color-controls">
            <label class="control-label" for="colorPicker">COLOR</label>
            <div class="color-options">
              <input
                type="color"
                value="#253047"
                id="colorPicker"
                aria-label="Choose a drawing color"
                title="Choose a drawing color"
              />
              <button class="color-swatch" type="button" data-color="#253047" aria-label="Ink" style="--swatch-color: #253047"></button>
              <button class="color-swatch" type="button" data-color="#e9785c" aria-label="Coral" style="--swatch-color: #e9785c"></button>
              <button class="color-swatch" type="button" data-color="#e9b64d" aria-label="Sunshine" style="--swatch-color: #e9b64d"></button>
              <button class="color-swatch" type="button" data-color="#5a9a82" aria-label="Sage" style="--swatch-color: #5a9a82"></button>
              <button class="color-swatch" type="button" data-color="#788bd0" aria-label="Periwinkle" style="--swatch-color: #788bd0"></button>
            </div>
          </div>

          <span class="toolbar-divider size-divider" aria-hidden="true"></span>

          <div class="size-control">
            <label class="control-label" for="brushSize">
              SIZE <span id="sizeValue" aria-live="polite">5 px</span>
            </label>
            <input id="brushSize" type="range" min="1" max="30" value="5" />
          </div>

          <button class="clear-button" id="clear" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3" />
            </svg>
            <span>Clear canvas</span>
          </button>
        </div>

        <div class="canvas-frame">
          <canvas id="canvas" width="1200" height="700" aria-label="Drawing canvas">
            Your browser does not support the drawing canvas.
          </canvas>
          <span class="canvas-hint" aria-hidden="true">Start anywhere</span>
        </div>
        <footer class="studio-footer">
          <span>Made for your next little idea.</span>
          <span class="canvas-size">1200 <span aria-hidden="true">×</span> 700</span>
        </footer>
      </section>

      <footer class="page-footer">No pressure. Just play.</footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
