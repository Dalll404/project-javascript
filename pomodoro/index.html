<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Pomodoro waktu</title>
  </head>
  <body>
    <h1>Pomodoro Timer</h1>

    <main class="card-pomodoro">
      <div class="card2-podomoro">
        <div class="info">
          <button id="fokus">Fokus</button>
          <button id="istirahat">Istirahat</button>
        </div>

        <div class="timer">
          <div id="timer">25 : 00</div>
        </div>

        <div class="operator">
          <button class="mulai">mulai</button>
          <button class="jeda">jeda</button>
          <button class="reset">reset</button>
        </div>
      </div>
      <p id="element"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
